<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Tarefas — Técnicos de TI | C@P Consultoria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --brand:#F2701A; --brand-dark:#C1662E;
    --ink:#1F2328; --muted:#6B7280; --line:#E4E7EC;
    --bg:#F5F6F8; --card:#FFFFFF;
    --side:#22262E; --side-2:#2B303A; --side-line:#363C46;
    --st-orcado:#6B7280; --st-aprovado:#2563EB; --st-compras:#D97706;
    --st-exec:#F2701A; --st-cobranca:#7C3AED; --st-final:#16A34A;
    --st-aguardcli:#0891B2; --st-reprovado:#DC2626;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  #app{display:flex;min-height:100vh}
  /* Sidebar */
  aside{width:236px;background:var(--side);color:#D6DAE0;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--side-line)}
  .logo img{width:40px;height:40px;object-fit:contain;border-radius:9px;background:#fff;padding:2px;flex-shrink:0}
  .logo b{color:#fff;font-size:15px;letter-spacing:.2px}
  .logo span{display:block;color:var(--brand);font-size:11px;font-weight:700;margin-top:2px}
  nav{padding:10px 8px;overflow-y:auto;flex:1}
  .nav-sec{color:#7C838F;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:14px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#C6CBD3;font-weight:500}
  .nav-item:hover{background:var(--side-2);color:#fff}
  .nav-item.active{background:var(--brand);color:#fff}
  .nav-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .nav-item .cnt{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px}
  .nav-item.active .cnt{background:rgba(0,0,0,.18)}
  .side-foot{padding:12px 16px;border-top:1px solid var(--side-line);font-size:11px;color:#7C838F}
  /* Main */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:14px}
  header.top h1{font-size:19px;margin:0}
  header.top .sub{color:var(--muted);font-size:12.5px}
  .content{padding:22px 26px;flex:1}
  /* Buttons */
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#F9FAFB}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:#B42318;border-color:#FDA29B}
  .btn.danger:hover{background:#FEF3F2}
  /* Cards / tables */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .kpi{padding:16px 18px}
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:600}
  .kpi .val{font-size:26px;font-weight:700;margin-top:4px}
  .kpi .val small{font-size:14px;color:var(--muted);font-weight:600}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:#FAFAFB}
  /* Forms */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#344054}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(242,112,26,.12)}
  textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  /* Pipeline */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
  .wk-nav{display:flex;align-items:center;gap:8px;font-weight:600}
  .wk-nav .btn{padding:6px 10px}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .day{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;text-align:center;cursor:pointer;min-width:52px}
  .day:hover{border-color:var(--brand)}
  .day.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .day.disabled{opacity:.5;cursor:default;pointer-events:none}
  .day b{display:block;font-size:12px}
  .day small{font-size:10.5px;color:var(--muted)}
  .day.on small{color:rgba(255,255,255,.85)}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;cursor:pointer;color:#344054}
  /* Lançamento cards */
  .lanc{padding:15px 17px;border-left:4px solid var(--line);margin-bottom:12px}
  .lanc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .lanc .title{font-size:15px;font-weight:700}
  .lanc .cli{color:var(--muted);font-size:12.5px;margin-top:1px}
  .meta{display:flex;flex-wrap:wrap;gap:14px;margin:11px 0;font-size:12.5px;color:#475467}
  .meta b{color:var(--ink);font-weight:600}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .badge.interno{background:#EEF2FF;color:#3730A3}
  .badge.externo{background:#FEF3C7;color:#92400E}
  .desc{font-size:13px;color:#475467;margin:6px 0 12px;white-space:pre-wrap}
  .lanc .acts{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
  .empty{text-align:center;color:var(--muted);padding:46px 20px}
  .empty .big{font-size:34px}
  .stage-title{display:flex;align-items:center;gap:9px;margin-bottom:2px}
  .stage-title .dot{width:11px;height:11px;border-radius:50%}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
  .modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mh h3{margin:0;font-size:17px}
  .modal .mb{padding:22px}
  .modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
  .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:none;background:none}
  /* Follow-up list */
  .fu{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px}
  .fu .fh{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .fu .ftag{font-weight:700;padding:1px 8px;border-radius:20px;background:#F2F4F7;color:#344054}
  /* Toast */
  #toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:9px;font-weight:600;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.25)}
  #toast.show{opacity:1;transform:translateY(0)}
  .banner{background:#FFF4EC;border:1px solid #FBD9BE;color:#8A4B12;padding:9px 14px;border-radius:9px;font-size:12.5px;margin-bottom:16px}
  /* Login */
  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 15%,#2B303A 0%,#181B21 72%);z-index:100}
  .login-card{background:#fff;border-radius:16px;padding:34px 30px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center}
  .login-card::before{content:"";display:block;height:4px;width:54px;background:var(--brand);border-radius:20px;margin:0 auto 18px}
  .login-logo{width:84px;height:84px;object-fit:contain;border-radius:15px;margin-bottom:14px}
  .login-card h2{margin:0;font-size:20px}
  .login-sub{color:var(--brand);font-weight:700;font-size:11px;letter-spacing:.7px;margin:3px 0 22px;text-transform:uppercase}
  .login-card .field{text-align:left}
  .login-err{color:#B42318;font-size:12.5px;min-height:18px;margin:0 0 10px;text-align:left}
  .login-foot{margin-top:16px;font-size:11.5px;color:var(--muted)}
  /* v3 additions */
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:40px}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:16px;padding:4px 6px;opacity:.65}
  .pw-toggle:hover{opacity:1}
  .mini-add{font-size:11px;font-weight:600;color:var(--brand);background:none;border:none;cursor:pointer;padding:0 0 0 6px}
  .mini-add:hover{text-decoration:underline}
  .valor-box{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#F9FAFB;font-weight:700;color:var(--brand)}
  .tec-row{display:flex;gap:8px;margin-bottom:8px}
  .tec-row select{flex:1}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .perm-chk{display:flex;align-items:center;gap:7px;font-weight:500;font-size:13px}
  .perm-chk input{width:auto}
  .day-group{margin-bottom:22px}
  .day-head{font-size:15px;font-weight:700;padding:9px 13px;background:#EEF1F4;border-radius:9px;margin-bottom:12px;display:flex;align-items:center;gap:8px;border-left:4px solid var(--brand)}
  .day-head small{color:var(--muted);font-weight:600;font-size:12px}
  .cnt2{margin-left:auto;background:#fff;border:1px solid var(--line);color:#344054;font-size:12px;font-weight:600;padding:1px 9px;border-radius:20px}
  @media(max-width:820px){
    #app{flex-direction:column}
    aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto}
    nav{display:flex;padding:6px;gap:4px}
    .nav-sec{display:none}.side-foot{display:none}.logo{border:none}
    .nav-item{white-space:nowrap;padding:8px 12px}
    .row2,.row3{grid-template-columns:1fr}
  }
</style>
</head>

/* ============ AUTH / SESSÃO ============ */
const SESSION_KEY='cap_gestao_ti_session';
const REMEMBER_KEY='cap_gestao_ti_remember';
let session=null;
function loadSession(){try{session=JSON.parse(localStorage.getItem(SESSION_KEY))||null;}catch(e){session=null;}}
function saveSession(s){session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(s));}
function clearSession(){session=null;localStorage.removeItem(SESSION_KEY);}
function authToken(){return (session&&session.access_token&&!session.local)?session.access_token:SUPABASE_KEY;}
async function apiLogin(email,pass){
  if(useLocalAuth()){saveSession({user:{email},access_token:'local',local:true});return;}
  const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pass})});
  const d=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(d.error_description||d.msg||d.message||('Erro '+res.status));
  saveSession({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user,expires_at:Date.now()+(d.expires_in||3600)*1000});
}
async function refreshToken(){
  if(!session||!session.refresh_token)return false;
  try{const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!res.ok)return false;const d=await res.json();
    saveSession({...session,access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000});
    return true;}catch(e){return false;}
}
function useLocalAuth(){return useLocal;}

async function sbFetch(path,{method='GET',body=null}={},_retry=false){
  const opts={method,headers:{
    'apikey':SUPABASE_KEY,'Authorization':'Bearer '+authToken(),
    'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);
  if(res.status===401 && !_retry && session && !session.local){
    if(await refreshToken()) return sbFetch(path,{method,body},true);
    doLogout(); throw new Error('Sessão expirada. Faça login novamente.');
  }
  if(!res.ok){throw new Error('Supabase '+res.status+': '+await res.text());}
  if(res.status===204) return null;
  return res.json();
}
const RemoteStore={
  list:t=>sbFetch(t+'?select=*'),

  update:async(t,id,o)=>(await sbFetch(t+'?id=eq.'+id,{method:'PATCH',body:o}))[0],
  remove:(t,id)=>sbFetch(t+'?id=eq.'+id,{method:'DELETE'})
};
const LocalStore={
  _k:'cap_gestao_ti_v1',_d:null,
  _load(){if(this._d)return;const r=localStorage.getItem(this._k);
    this._d=r?JSON.parse(r):{clientes:[],tecnicos:[],tipos_servico:[],lancamentos:[],followups:[],usuarios:[],_seq:1};
    ['clientes','tecnicos','tipos_servico','lancamentos','followups','usuarios','metas','motivos'].forEach(k=>{if(!this._d[k])this._d[k]=[];});},
  _save(){localStorage.setItem(this._k,JSON.stringify(this._d));},
  async list(t){this._load();return JSON.parse(JSON.stringify(this._d[t]));},
  async insert(t,o){this._load();const row={...o,id:this._d._seq++,created_at:new Date().toISOString()};
    this._d[t].push(row);this._save();return row;},
  async update(t,id,o){this._load();const i=this._d[t].findIndex(r=>r.id===id);
    if(i>=0)this._d[t][i]={...this._d[t][i],...o};this._save();return this._d[t][i];},
  async remove(t,id){this._load();this._d[t]=this._d[t].filter(r=>r.id!==id);
    if(t==='lancamentos')this._d.followups=this._d.followups.filter(f=>f.lancamento_id!==id);this._save();}
};

/* ============ HELPERS ============ */
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function isoDay(d){return d.toISOString().slice(0,10);}
function brDate(iso){if(!iso)return '—';const p=iso.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function calcHoras(ini,fim){if(!ini||!fim)return 0;const a=ini.split(':').map(Number),b=fim.split(':').map(Number);
  let m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<0)m+=1440;return m/60;}
function brl(n){return 'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});}
function nome(arr,id){const x=arr.find(r=>r.id===id);return x?x.nome:'—';}
function tecById(id){return db.tecnicos.find(t=>t.id===id);}
function lancTecIds(l){return Array.isArray(l.tecnico_ids)&&l.tecnico_ids.length?l.tecnico_ids:(l.tecnico_id?[l.tecnico_id]:[]);}
function tecNomes(l){const ids=lancTecIds(l);return ids.length?ids.map(id=>nome(db.tecnicos,id)).join(', '):'—';}
function horasLanc(l){return calcHoras(l.hora_inicio,l.hora_fim);}
function custoLanc(l){const h=horasLanc(l);return lancTecIds(l).reduce((a,id)=>{const t=tecById(id);return a+h*(t?Number(t.custo_hora)||0:0);},0);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_C=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function refMonth(l){return l.data_execucao||l.data_finalizacao||l.data_abertura||'';}
function diasEntre(a,b){if(!a||!b)return null;const d1=new Date(String(a).slice(0,10)+'T00:00:00'),d2=new Date(String(b).slice(0,10)+'T00:00:00');return Math.round((d2-d1)/86400000);}
function leadTime(l){return diasEntre(l.data_abertura,l.data_finalizacao);}
function diasEmAberto(l){return diasEntre(l.data_abertura,isoDay(new Date()));}
function yearsAvailable(){
  const set=new Set([new Date().getFullYear()]);
  db.lancamentos.forEach(l=>{const d=refMonth(l);if(d)set.add(+d.slice(0,4));if(l.data_reprovacao)set.add(+String(l.data_reprovacao).slice(0,4));});
  (db.metas||[]).forEach(m=>set.add(+m.ano));
  return [...set].sort((a,b)=>b-a);
}
function inPeriodo(d,ano,mes){if(!d)return false;d=String(d).slice(0,10);if(+d.slice(0,4)!==+ano)return false;if(mes!=='todos'&&+d.slice(5,7)!==+mes)return false;return true;}
function lancsFiltrados(){return db.lancamentos.filter(l=>l.etapa!=='reprovado'&&inPeriodo(refMonth(l),state.dashAno,state.dashMes));}
function metaFor(ano,mes){const m=(db.metas||[]).find(x=>+x.ano===+ano&&+x.mes===+mes);return m?Number(m.meta_horas)||0:0;}
function horasRealizadasMes(ano,mes){return db.lancamentos.filter(l=>l.etapa!=='reprovado'&&inPeriodo(refMonth(l),ano,mes)).reduce((a,l)=>a+horasLanc(l),0);}
function horasCobradasMes(ano,mes){return db.lancamentos.filter(l=>['cobranca','finalizado'].includes(l.etapa)&&inPeriodo(refMonth(l),ano,mes)).reduce((a,l)=>a+horasLanc(l),0);}
function viewDashboard(){
  const ls=lancsFiltrados();
  const totHoras=ls.reduce((a,l)=>a+horasLanc(l),0);
  const totCusto=ls.reduce((a,l)=>a+custoLanc(l),0);
  const emExec=db.lancamentos.filter(l=>l.etapa==='em_execucao').length;
  const fin=ls.filter(l=>l.etapa==='finalizado'&&leadTime(l)!=null);
  const leadMedio=fin.length?fin.reduce((a,l)=>a+leadTime(l),0)/fin.length:null;
  const anoInteiro=state.dashMes==='todos';
  let meta=0,cobrado=0;
  if(anoInteiro){for(let m=1;m<=12;m++){meta+=metaFor(state.dashAno,m);cobrado+=horasCobradasMes(state.dashAno,m);}}
  else{meta=metaFor(state.dashAno,state.dashMes);cobrado=horasCobradasMes(state.dashAno,state.dashMes);}
  const pct=meta>0?Math.round(totHoras/meta*100):0;
  const anoOpts=yearsAvailable().map(y=>`<option value="${y}" ${+state.dashAno===y?'selected':''}>${y}</option>`).join('');
  const mesOpts=`<option value="todos" ${anoInteiro?'selected':''}>Ano inteiro</option>`+
    MESES.map((nm,i)=>`<option value="${i+1}" ${(!anoInteiro&&+state.dashMes===i+1)?'selected':''}>${nm}</option>`).join('');
  return `
  ${useLocal?'<div class="banner">Rodando em <b>modo local</b>: os dados ficam salvos apenas neste navegador. Preencha <b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b> no topo do arquivo para usar o Supabase.</div>':''}
  <div class="toolbar">
    <span style="font-weight:600">Período:</span>
    <select style="width:auto" onchange="state.dashMes=this.value;render()">${mesOpts}</select>
    <select style="width:auto" onchange="state.dashAno=+this.value;render()">${anoOpts}</select>
    ${can('metas')?'<button class="btn sm" onclick="go(\'metas\')">🎯 Editar metas</button>':''}
  </div>
  <div class="grid kpis" style="margin-bottom:18px">
    <div class="card kpi"><div class="lbl">Horas realizadas</div><div class="val">${num(totHoras)}<small> h</small></div></div>
    <div class="card kpi"><div class="lbl">Meta de horas (${anoInteiro?'ano':'mês'})</div><div class="val">${num(meta)}<small> h</small></div></div>
    <div class="card kpi"><div class="lbl">Horas cobradas</div><div class="val">${num(cobrado)}<small> h</small></div></div>
    <div class="card kpi"><div class="lbl">% da meta</div><div class="val" style="color:${pct>=100?'var(--st-final)':'var(--brand)'}">${meta>0?pct+'%':'—'}</div></div>
    <div class="card kpi"><div class="lbl">Custo de mão de obra</div><div class="val" style="color:var(--brand)">${brl(totCusto)}</div></div>
    <div class="card kpi"><div class="lbl">Em execução</div><div class="val">${emExec}</div></div>
    <div class="card kpi"><div class="lbl">Lead time médio (atendimento)</div><div class="val">${leadMedio!=null?num(leadMedio):'—'}<small> dia(s)</small></div></div>
  </div>
  <div class="card" style="padding:20px;margin-bottom:18px">
    <h3 style="margin:0 0 4px">Horas realizadas × previstas (meta) por técnico</h3>
    <div class="hint" style="margin-bottom:14px">Meta = horas previstas/mês do técnico.</div>
    <div style="height:360px"><canvas id="chart"></canvas></div>
  </div>
  <div class="card" style="padding:20px">
    <h3 style="margin:0 0 4px">Meta × realizado × cobrado por mês — ${state.dashAno}</h3>
    <div class="hint" style="margin-bottom:14px">Metas definidas na tela “Metas”. Cobrado = horas em Cobrança/Finalizado.</div>
    <div style="height:320px"><canvas id="chartMeta"></canvas></div>
  </div>`;
}
function mountChart(){
  const ls=lancsFiltrados();
  const mult=state.dashMes==='todos'?12:1;
  const labels=[],horas=[],meta=[];
  db.tecnicos.forEach(t=>{
    const meus=ls.filter(l=>lancTecIds(l).includes(t.id));
    const h=meus.reduce((a,l)=>a+horasLanc(l),0);
    if(h>0||meus.length){labels.push(t.nome);horas.push(+h.toFixed(2));
      meta.push(+((Number(t.horas_previstas_mes)||0)*mult).toFixed(2));}
  });
  const ctx=document.getElementById('chart');if(!ctx)return;
  if(!labels.length){ctx.parentElement.innerHTML='<div class="empty"><div class="big">📊</div>Sem lançamentos com horas no período.</div>';return;}
  charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'Horas realizadas',data:horas,backgroundColor:'#C1662E',borderRadius:5},
    {label:'Horas previstas (meta)',data:meta,backgroundColor:'#CBD5E1',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+num(c.raw)+' h'}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'Horas'}}}}}));
}
function mountMetaChart(){
  const ctx=document.getElementById('chartMeta');if(!ctx)return;
  const meta=[],real=[],cob=[];
  for(let m=1;m<=12;m++){meta.push(+metaFor(state.dashAno,m).toFixed(2));real.push(+horasRealizadasMes(state.dashAno,m).toFixed(2));cob.push(+horasCobradasMes(state.dashAno,m).toFixed(2));}
  charts.push(new Chart(ctx,{type:'bar',data:{labels:MESES_C,datasets:[
    {label:'Meta',data:meta,backgroundColor:'#CBD5E1',borderRadius:4},
    {label:'Realizado',data:real,backgroundColor:'#C1662E',borderRadius:4},
    {label:'Cobrado',data:cob,backgroundColor:'#16A34A',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+num(c.raw)+' h'}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'Horas'}}}}}));
}
/* ============ METAS ============ */
function viewMetas(){
  const anoOpts=yearsAvailable().map(y=>`<option value="${y}" ${+state.metaAno===y?'selected':''}>${y}</option>`).join('');
  const rows=MESES.map((nm,i)=>{const mes=i+1,meta=metaFor(state.metaAno,mes),real=horasRealizadasMes(state.metaAno,mes),cob=horasCobradasMes(state.metaAno,mes),pct=meta>0?Math.round(real/meta*100):0;
    return `<tr><td><b>${nm}</b></td>
      <td><input type="number" step="0.5" min="0" id="meta_${mes}" value="${meta||''}" style="width:110px" placeholder="0"></td>
      <td>${num(real)} h</td><td>${num(cob)} h</td>
      <td>${meta>0?`<b style="color:${pct>=100?'var(--st-final)':'var(--brand)'}">${pct}%</b>`:'—'}</td></tr>`;}).join('');
  return `<div class="banner">Defina a meta de horas de cada mês. “Realizado” e “Cobrado” são calculados automaticamente a partir dos lançamentos.</div>
    <div class="toolbar"><span style="font-weight:600">Ano:</span>
      <select style="width:auto" onchange="state.metaAno=+this.value;render()">${anoOpts}</select>
      <button class="btn primary sm" onclick="saveMetas()">Salvar metas</button>
    </div>
    <div class="card"><table><thead><tr><th>Mês</th><th>Meta (h)</th><th>Realizado</th><th>Cobrado</th><th>% atingido</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function saveMetas(){
  for(let mes=1;mes<=12;mes++){
    const v=Number(val('meta_'+mes))||0;
    const ex=(db.metas||[]).find(x=>+x.ano===+state.metaAno&&+x.mes===mes);
    if(ex){if((Number(ex.meta_horas)||0)!==v)await store.update('metas',ex.id,{meta_horas:v});}

/* ============ PIPELINE ============ */
function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-dn+3);
  const firstTh=dt.getTime(); dt.setUTCMonth(0,1);
  if(dt.getUTCDay()!==4) dt.setUTCMonth(0,1+((4-dt.getUTCDay())+7)%7);
  return 1+Math.round((firstTh-dt.getTime())/(7*864e5));
}
function mondayOfISOWeek(week,year){
  const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow=simple.getUTCDay(), monday=new Date(simple);
  if(dow<=4) monday.setUTCDate(simple.getUTCDate()-((dow+6)%7));
  else monday.setUTCDate(simple.getUTCDate()+(8-dow));
  return new Date(monday.getUTCFullYear(),monday.getUTCMonth(),monday.getUTCDate());
}
function weekBar(){
  const ws=state.weekStart, we=addDays(ws,6), wn=isoWeek(ws);
  const rng=`${('0'+ws.getDate()).slice(-2)}/${('0'+(ws.getMonth()+1)).slice(-2)} – ${('0'+we.getDate()).slice(-2)}/${('0'+(we.getMonth()+1)).slice(-2)}`;
  return `<div class="toolbar">
      <label class="switch"><input type="checkbox" style="width:auto" ${state.wkFilterOn?'checked':''} onchange="state.wkFilterOn=this.checked;render()"> Filtrar por semana</label>
      <div class="wk-nav" style="${state.wkFilterOn?'':'opacity:.45;pointer-events:none'}">
        <button class="btn" onclick="shiftWeek(-1)">◀</button>
        <span>Semana Nº</span>
        <input type="number" min="1" max="53" value="${wn}" style="width:66px;text-align:center" title="Ir para o número da semana" onchange="gotoWeek(this.value)">
        <button class="btn" onclick="shiftWeek(1)">▶</button>
        <span style="color:var(--muted)">${rng}</span>
        <button class="btn sm" onclick="state.weekStart=startOfWeek(new Date());render()">Hoje</button>
      </div>

function viewPipeline(etapa){
  const all=db.lancamentos.filter(l=>l.etapa===etapa.key);
  const shown=state.wkFilterOn?all.filter(inWeek):all;
  const empty=`<div class="card"><div class="empty"><div class="big">📭</div>Nenhum serviço nesta etapa${state.wkFilterOn?' na semana selecionada':''}.</div></div>`;
  let body='';
  if(!state.wkFilterOn){
    body=shown.length?shown.map(lancCard).join(''):empty;
  }else{
    let any=false;
    for(let i=0;i<7;i++){
      const dd=addDays(state.weekStart,i);
      const items=all.filter(l=>{const d=l[state.wkField];if(!d)return false;return sameDay(new Date(d.slice(0,10)+'T00:00:00'),dd);});
      if(!items.length)continue; any=true;
      body+=`<div class="day-group"><div class="day-head">${DIAS[i]} <small>${('0'+dd.getDate()).slice(-2)}/${('0'+(dd.getMonth()+1)).slice(-2)}</small><span class="cnt2">${items.length}</span></div>${items.map(lancCard).join('')}</div>`;
    }
    if(!any)body=empty;
  }
  return `<div class="stage-title"><span class="dot" style="background:${etapa.color}"></span><h3 style="margin:0">${etapa.label}</h3>
      <span class="cnt" style="background:#F2F4F7;color:#344054;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600">${shown.length}</span></div>
    <div class="hint" style="margin-bottom:16px">Use ← / → para mover o serviço entre as etapas.</div>
    ${weekBar()}
    ${body}`;
}
async function avancar(id){const l=db.lancamentos.find(x=>x.id===id);const i=ETAPAS.findIndex(e=>e.key===l.etapa);
  if(i<ETAPAS.length-1){const nx=ETAPAS[i+1];await store.update('lancamentos',id,{etapa:nx.key});await refresh();render();toast('Movido para: '+nx.label);}}
async function voltar(id){const l=db.lancamentos.find(x=>x.id===id);const i=ETAPAS.findIndex(e=>e.key===l.etapa);

const MODULES=[

  {key:'reprovados',label:'Reprovados'},

];
const ADMIN_EMAIL='fkcap2026@gmail.com';
const PERFIS={
  admin:null,
  tecnico:{dashboard:1,novo:1,fluxo:1,clientes:1,tipos:1},
  visualizador:{dashboard:1,fluxo:1},
  personalizado:{}
};
function perfilLabel(p){return {admin:'Administrador',tecnico:'Técnico',visualizador:'Visualizador',personalizado:'Personalizado'}[p]||p||'—';}
function currentUserRow(){const em=((session&&session.user&&session.user.email)||'').toLowerCase();
  return db.usuarios.find(u=>(u.email||'').toLowerCase()===em)||null;}
function isAdmin(){
  const em=((session&&session.user&&session.user.email)||'').toLowerCase();
  if(em===ADMIN_EMAIL)return true;
  if(!db.usuarios.length)return true;
  const u=currentUserRow();return u?u.perfil==='admin':false;
}
function can(mod){
  if(isAdmin())return true;
  const u=currentUserRow();
  if(!u||u.ativo===false)return false;
  return !!(u.permissoes||{})[mod];
}
function allowedView(v){
  if(v==='dashboard')return can('dashboard');
  if(v==='novo')return can('novo');
  if(v==='clientes')return can('clientes');
  if(v==='tecnicos')return can('tecnicos');
  if(v==='tipos')return can('tipos');
  if(v==='usuarios')return can('usuarios');
  if(v==='metas')return can('metas');
  if(v==='reprovados')return can('reprovados');
  if(v.startsWith('pipe:'))return can('fluxo');
  return true;
}
function firstAllowed(){return ['dashboard','novo','pipe:orcado','reprovados','clientes','tecnicos','tipos','metas','usuarios'].find(allowedView)||'dashboard';}

function applyPerfil(perfil){
  const chks=[...document.querySelectorAll('.u_perm')];
  if(perfil==='admin'){chks.forEach(c=>{c.checked=true;c.disabled=true;});return;}
  chks.forEach(c=>c.disabled=false);
  if(perfil==='personalizado')return;
  const preset=PERFIS[perfil]||{};
  chks.forEach(c=>{c.checked=!!preset[c.dataset.k];});
}
function onPerfilChange(){applyPerfil(val('u_perfil'));}
async function saveUsuario(id){
  const email=val('u_email').toLowerCase();
  if(!email){toast('Informe o e-mail');return;}
  const perfil=val('u_perfil');
  const permissoes={};
  if(perfil==='admin'){MODULES.forEach(m=>permissoes[m.key]=true);}
  else{[...document.querySelectorAll('.u_perm')].forEach(c=>{permissoes[c.dataset.k]=c.checked;});}
  const o={email,nome:val('u_nome'),perfil,ativo:val('u_ativo')==='1',permissoes};
  await (id?store.update('usuarios',id,o):store.insert('usuarios',o));
  await refresh();closeModal();render();toast('Usuário salvo');
}
